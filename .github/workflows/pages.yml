name: Publish Meshki Media to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - "automation/build-pages-data.mjs"
      - "automation/build-site.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official ratings
        run: node automation/build-pages-data.mjs
        continue-on-error: true
      - name: Regenerate static pages from data
        run: node automation/build-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
